name: One-time cleanup all workflow artifacts

on:
  push:
    paths:
      - '.github/workflows/cleanup-artifacts.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete every existing Actions artifact in this repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          deleted=0
          while true; do
            ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&page=1" --jq '.artifacts[].id')
            if [ -z "$ids" ]; then
              break
            fi
            for id in $ids; do
              echo "Deleting artifact $id"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
              deleted=$((deleted + 1))
            done
          done
          echo "Deleted artifacts: $deleted"
