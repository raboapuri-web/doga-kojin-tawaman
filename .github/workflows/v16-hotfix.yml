name: V16 Source Hotfix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/v16-hotfix.yml']
permissions:
  contents: write
  actions: write
jobs:
  fix-and-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Fix V16 TSX parser ambiguity
        run: |
          sed -i 's/i===1?.8:1/i===1 ? .8 : 1/g' v16-weapon-convergence/src/index.tsx
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v16-weapon-convergence/src/index.tsx
          git diff --cached --quiet || git commit -m 'Fix V16 TSX ternary syntax'
          git push origin HEAD:main
      - name: Dispatch V16 production
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run v16-weapon-convergence-production.yml --repo "$GITHUB_REPOSITORY" --ref main
