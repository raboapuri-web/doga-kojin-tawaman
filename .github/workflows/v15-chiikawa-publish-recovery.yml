name: V15 Chiikawa Publish Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v15-chiikawa-publish-recovery.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: v15-chiikawa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download narration and timing from original V15 run
        uses: actions/download-artifact@v4
        with:
          name: v15-prepared
          path: v15-chiikawa
          repository: ${{ github.repository }}
          run-id: 34263392935
          github-token: ${{ github.token }}

      - name: Download rendered segments from original V15 run
        uses: actions/download-artifact@v4
        with:
          pattern: v15-segment-*
          path: v15-chiikawa/parts
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: 34263392935
          github-token: ${{ github.token }}

      - name: Generate BGM only
        run: node scripts/generate-bgm.mjs

      - name: Concatenate successful segments without re-encoding
        run: |
          mkdir -p out
          find parts -maxdepth 1 -name 'segment-*.mp4' -print | sort -V | while read -r f; do
            printf "file '%s'\n" "$(realpath "$f")"
          done > out/concat.txt
          test "$(wc -l < out/concat.txt)" -eq 6
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4

      - name: Mix narration and BGM
        run: |
          ffmpeg -y -loglevel error \
            -i out/video-only.mp4 \
            -i public/audio/narration.m4a \
            -i public/audio/bgm.m4a \
            -filter_complex "[1:a]volume=1.0[vo];[2:a]volume=0.095[bg];[vo][bg]amix=inputs=2:duration=longest:dropout_transition=2[a]" \
            -map 0:v:0 -map "[a]" \
            -c:v copy -c:a aac -b:a 192k -movflags +faststart -shortest \
            out/v15-chiikawa-final.mp4

      - name: Verify final duration
        run: |
          test -s out/v15-chiikawa-final.mp4
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 out/v15-chiikawa-final.mp4)
          echo "Final duration: ${DURATION}s"
          python3 - <<'PY'
          import subprocess
          d=float(subprocess.check_output([
            'ffprobe','-v','error','-show_entries','format=duration',
            '-of','default=noprint_wrappers=1:nokey=1',
            'out/v15-chiikawa-final.mp4'
          ]).decode().strip())
          assert 1080 <= d <= 1095, f'Unexpected V15 duration: {d:.3f}s'
          PY

      - name: Create corrected QA contact sheet
        run: |
          ffmpeg -y -loglevel error -i out/v15-chiikawa-final.mp4 \
            -vf "fps=1/25,scale=240:135,tile=8x8" \
            -frames:v 1 -q:v 2 out/v15-chiikawa-contact-sheet.jpg
          test -s out/v15-chiikawa-contact-sheet.jpg

      - name: Publish V15 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VIDEO_NAME="knowledge-video-v15-chiikawa-34263392935.mp4"
          cp out/v15-chiikawa-final.mp4 "out/${VIDEO_NAME}"
          TAG="v15-chiikawa-34263392935"
          gh release create "$TAG" \
            "out/${VIDEO_NAME}" \
            out/v15-chiikawa-contact-sheet.jpg \
            --repo "$GITHUB_REPOSITORY" \
            --title "V15 Chiikawa Labor Economics Production 34263392935" \
            --notes "18-minute production-length story-linked Remotion video based on the supplied Chiikawa labor-economics script. 62 narration-linked beats with more than 40 dedicated visual mechanisms. Narration + BGM only; no sound effects. Rendered in six short parallel segments and concatenated losslessly to avoid long-render timeouts. This release reuses the already-successful render segments from run 34263392935; no re-render was required after a QA contact-sheet rounding issue."
