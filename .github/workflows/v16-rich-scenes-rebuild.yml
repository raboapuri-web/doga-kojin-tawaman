name: V16 Rich Scenes Rebuild

on:
  push:
    paths:
      - '.github/workflows/v16-rich-scenes-rebuild.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch-and-dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wire RichScene into V16
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v16-weapon-convergence/src/index.tsx')
          s=p.read_text()
          imp="import {RichScene} from './RichScenes';\n"
          if imp not in s:
              needle="import data from './script-data.json';import sync from './sync-timing.json';\n"
              s=s.replace(needle, needle+imp)
          hook="const rich=RichScene({visual,index,p,chapter});if(rich)return rich;\n"
          needle="function Scene({visual,index,p,chapter}:{visual:string;index:number;p:number;chapter:string}){const q=ease(p),t=p+index*.03;\n"
          if hook not in s:
              s=s.replace(needle, needle+hook)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v16-weapon-convergence/src/index.tsx v16-weapon-convergence/src/RichScenes.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Wire rich dedicated scenes into V16"
            git push
          fi
      - name: Dispatch production rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/v16-weapon-convergence-production.yml/dispatches \
            -d '{"ref":"main"}'
