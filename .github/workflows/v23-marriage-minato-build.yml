name: V23 Marriage Minato Full Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v23-marriage-minato-build.yml'
      - 'trigger/v23-marriage-minato-*'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    defaults:
      run:
        working-directory: v23-marriage-minato
    steps:
      - name: Checkout V23 branch
        uses: actions/checkout@v4
        with:
          ref: v23-marriage-minato-full
      - name: Install audio tools and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build full script beats
        run: node scripts/build-beats.mjs
      - name: Type check
        run: npm run check
      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then echo 'VOICEVOX ready'; exit 0; fi
            sleep 2
          done
          docker logs voicevox || true
          exit 1
      - name: Generate measured Aoyama Ryusei narration
        run: node scripts/generate-voicevox.mjs
      - name: Plan parallel segments
        id: plan
        run: |
          MATRIX="$(node scripts/plan-segments.mjs)"
          echo "$MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
      - name: Upload prepared assets
        uses: actions/upload-artifact@v4
        with:
          name: v23-marriage-prepared
          retention-days: 1
          if-no-files-found: error
          path: |
            v23-marriage-minato/src/beats.json
            v23-marriage-minato/src/sync-timing.json
            v23-marriage-minato/public/audio/narration.m4a

  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        working-directory: v23-marriage-minato
    steps:
      - name: Checkout V23 branch
        uses: actions/checkout@v4
        with:
          ref: v23-marriage-minato-full
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Download prepared assets
        uses: actions/download-artifact@v4
        with:
          name: v23-marriage-prepared
          path: v23-marriage-minato
      - name: Render segment ${{ matrix.id }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          mkdir -p out
          npx remotion render src/index.ts V23MarriageMinato "out/segment-${{ matrix.id }}.mp4" \
            --frames=${{ matrix.start }}-${{ matrix.end }} \
            --codec=h264 --crf=21 --concurrency=2 --log=warn
          test -s "out/segment-${{ matrix.id }}.mp4"
      - name: Upload segment
        uses: actions/upload-artifact@v4
        with:
          name: v23-marriage-segment-${{ matrix.id }}
          retention-days: 1
          if-no-files-found: error
          path: v23-marriage-minato/out/segment-${{ matrix.id }}.mp4

  finalize:
    needs: [prepare, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: v23-marriage-minato
    steps:
      - name: Checkout V23 branch
        uses: actions/checkout@v4
        with:
          ref: v23-marriage-minato-full
      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download prepared assets
        uses: actions/download-artifact@v4
        with:
          name: v23-marriage-prepared
          path: v23-marriage-minato
      - name: Download segments
        uses: actions/download-artifact@v4
        with:
          pattern: v23-marriage-segment-*
          path: v23-marriage-minato/parts
          merge-multiple: true
      - name: Generate BGM
        run: node scripts/generate-bgm.mjs
      - name: Concatenate
        run: |
          mkdir -p out
          find parts -maxdepth 1 -name 'segment-*.mp4' -print | sort -V | while read -r f; do printf "file '%s'\n" "$(realpath "$f")"; done > out/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4
      - name: Mix narration and BGM
        run: |
          ffmpeg -y -loglevel error -i out/video-only.mp4 -i public/audio/narration.m4a -i public/audio/bgm.m4a \
            -filter_complex "[1:a]volume=1.0[vo];[2:a]volume=0.07[bg];[vo][bg]amix=inputs=2:duration=longest:dropout_transition=2[a]" \
            -map 0:v:0 -map "[a]" -c:v copy -c:a aac -b:a 192k -movflags +faststart -shortest out/v23-marriage-minato-final.mp4
      - name: Verify output
        run: |
          test -s out/v23-marriage-minato-final.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 out/v23-marriage-minato-final.mp4
      - name: Contact sheet
        run: |
          ffmpeg -y -loglevel error -i out/v23-marriage-minato-final.mp4 -vf "fps=1/25,scale=240:135,tile=8x8" -frames:v 1 -q:v 2 out/contact-sheet.jpg
      - name: Upload final
        uses: actions/upload-artifact@v4
        with:
          name: v23-marriage-minato-final
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
          path: |
            v23-marriage-minato/out/v23-marriage-minato-final.mp4
            v23-marriage-minato/out/contact-sheet.jpg
            v23-marriage-minato/src/sync-timing.json
            v23-marriage-minato/src/beats.json
