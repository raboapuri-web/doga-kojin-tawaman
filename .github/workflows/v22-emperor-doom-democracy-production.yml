name: V22 Emperor Doom Democracy Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v22-emperor-doom-democracy-production.yml'
      - 'v22-emperor-doom-democracy/**'

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    defaults:
      run:
        working-directory: v22-emperor-doom-democracy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install tools from Ubuntu only
        run: |
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-
          sudo apt-get install -y -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- ffmpeg fonts-noto-cjk
          fc-cache -f
          cp ../v15-chiikawa/package.json package.json
          cp ../v15-chiikawa/tsconfig.json tsconfig.json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate curated narration and semantic scenes
        run: |
          python3 - <<'PY'
          import json,re
          src=json.load(open('src/script-data.json',encoding='utf-8'))
          voice=json.load(open('src/speech-data.json',encoding='utf-8'))
          ids=[b['id'] for b in src['beats']]
          vids=[b['id'] for b in voice['beats']]
          if ids!=vids: raise SystemExit('speech-data IDs/order mismatch')
          if len(ids)<90: raise SystemExit('V22 must keep high scene density')
          bad=[]
          for b in voice['beats']:
            t=b.get('speech','').strip()
            if not t or re.search(r'[0-9A-Za-z]',t): bad.append((b['id'],t))
          if bad:
            print('Unsafe speech:',bad[:12]);raise SystemExit('Curated speech contains raw digits/ASCII')
          scene=open('src/scenes.tsx',encoding='utf-8').read()
          missing=[b['visual'] for b in src['beats'] if f"'{b['visual']}'" not in scene]
          if missing: raise SystemExit(f'Missing semantic visuals: {missing}')
          if len(set(b['visual'] for b in src['beats']))!=len(src['beats']): raise SystemExit('Visual IDs must be unique per beat')
          print(f'Validated {len(ids)} curated beats / unique semantic visuals')
          PY
      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do curl -fsS http://127.0.0.1:50021/version >/dev/null && exit 0; sleep 2; done
          docker logs voicevox || true
          exit 1
      - name: Generate measured narration
        run: |
          mkdir -p public/audio .voice-tmp
          cat > /tmp/v22voice.mjs <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import {execFileSync} from 'node:child_process';
          const root=process.cwd();
          const script=JSON.parse(fs.readFileSync('src/script-data.json','utf8'));
          const voice=JSON.parse(fs.readFileSync('src/speech-data.json','utf8'));
          const vm=new Map(voice.beats.map(b=>[b.id,b.speech]));
          const base='http://127.0.0.1:50021';
          const speakers=await fetch(`${base}/speakers`).then(r=>r.json());
          const sp=speakers.find(s=>s.name==='青山龍星')??speakers[0];
          const st=sp.styles.find(s=>s.name==='ノーマル')??sp.styles[0];
          console.log(`VOICEVOX ${sp.name}/${st.name}/${st.id}`);
          let cursor=0;const timings=[],files=[];
          for(let i=0;i<script.beats.length;i++){
            const b=script.beats[i],text=vm.get(b.id);if(!text)throw new Error(`missing speech ${b.id}`);
            const q=await fetch(`${base}/audio_query?speaker=${st.id}&text=${encodeURIComponent(text)}`,{method:'POST'}).then(r=>r.json());
            q.speedScale=1.01;q.pitchScale=-.035;q.intonationScale=.84;q.prePhonemeLength=.10;q.postPhonemeLength=.12;
            const wav=Buffer.from(await fetch(`${base}/synthesis?speaker=${st.id}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(q)}).then(r=>r.arrayBuffer()));
            const raw=path.join(root,'.voice-tmp',`b-${String(i).padStart(3,'0')}.wav`),pad=path.join(root,'.voice-tmp',`b-${String(i).padStart(3,'0')}-p.wav`);
            fs.writeFileSync(raw,wav);execFileSync('ffmpeg',['-y','-loglevel','error','-i',raw,'-af','apad=pad_dur=0.18',pad]);
            const d=Number(execFileSync('ffprobe',['-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',pad],{encoding:'utf8'}).trim());
            timings.push({id:b.id,index:i,start:cursor,end:cursor+d});cursor+=d;files.push(pad);console.log(`${b.id}: ${d.toFixed(2)}s`);
          }
          const list=path.join(root,'.voice-tmp/list.txt');fs.writeFileSync(list,files.map(f=>`file '${f}'`).join('\n'));
          const joined=path.join(root,'.voice-tmp/narration.wav');execFileSync('ffmpeg',['-y','-loglevel','error','-f','concat','-safe','0','-i',list,'-c','copy',joined]);
          const measured=Number(execFileSync('ffprobe',['-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',joined],{encoding:'utf8'}).trim());
          fs.writeFileSync('src/sync-timing.json',JSON.stringify({durationSeconds:measured+.3,beats:timings},null,2));
          execFileSync('ffmpeg',['-y','-loglevel','error','-i',joined,'-c:a','aac','-b:a','160k','-ar','48000','public/audio/narration.m4a']);
          console.log(`Narration duration: ${measured.toFixed(2)}s`);
          NODE
          node /tmp/v22voice.mjs
      - name: Type check rich scenes
        run: npx tsc --noEmit
      - name: Plan parallel segments
        id: plan
        run: |
          MATRIX=$(node --input-type=module <<'NODE'
          import fs from 'node:fs';const s=JSON.parse(fs.readFileSync('src/sync-timing.json','utf8')),fps=30,target=145,max=185;let start=0,startSec=0,last=-1;const seg=[];for(let i=0;i<s.beats.length;i++){const b=s.beats[i],isLast=i===s.beats.length-1,elapsed=b.end-startSec,nextToo=!isLast&&(s.beats[i+1].end-startSec)>max;if(isLast||elapsed>=target||nextToo){const end=isLast?Math.ceil(s.durationSeconds*fps)-1:Math.max(start,Math.round(b.end*fps)-1);seg.push({id:String(seg.length).padStart(2,'0'),start,end});last=end;start=end+1;startSec=(end+1)/fps}}if(last<Math.ceil(s.durationSeconds*fps)-1)seg.push({id:String(seg.length).padStart(2,'0'),start:last+1,end:Math.ceil(s.durationSeconds*fps)-1});console.log(JSON.stringify({include:seg}));
          NODE
          )
          echo "$MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
      - name: Upload prepared
        uses: actions/upload-artifact@v4
        with:
          name: v22-prepared
          retention-days: 1
          if-no-files-found: error
          path: |
            v22-emperor-doom-democracy/src/sync-timing.json
            v22-emperor-doom-democracy/public/audio/narration.m4a

  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        working-directory: v22-emperor-doom-democracy
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime
        run: |
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-
          sudo apt-get install -y -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- fonts-noto-cjk
          fc-cache -f
          cp ../v15-chiikawa/package.json package.json
          cp ../v15-chiikawa/tsconfig.json tsconfig.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: v22-prepared
          path: v22-emperor-doom-democracy
      - name: Render segment ${{ matrix.id }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          mkdir -p out
          npx remotion render src/index.tsx V22EmperorDoomDemocracy "out/segment-${{ matrix.id }}.mp4" \
            --frames=${{ matrix.start }}-${{ matrix.end }} \
            --codec=h264 --crf=19 --concurrency=2 --log=warn
          test -s "out/segment-${{ matrix.id }}.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: v22-segment-${{ matrix.id }}
          retention-days: 1
          if-no-files-found: error
          path: v22-emperor-doom-democracy/out/segment-${{ matrix.id }}.mp4

  finalize:
    needs: [prepare, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: v22-emperor-doom-democracy
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-
          sudo apt-get install -y -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: v22-prepared
          path: v22-emperor-doom-democracy
      - uses: actions/download-artifact@v4
        with:
          pattern: v22-segment-*
          path: v22-emperor-doom-democracy/parts
          merge-multiple: true
      - name: Generate cinematic BGM
        run: |
          mkdir -p public/audio
          D=$(node -e "const s=require('./src/sync-timing.json');console.log(Math.ceil(s.durationSeconds+2))")
          FO=$((D-10))
          ffmpeg -y -loglevel error \
            -f lavfi -i "sine=frequency=42:duration=${D}" \
            -f lavfi -i "sine=frequency=63:duration=${D}" \
            -f lavfi -i "sine=frequency=84:duration=${D}" \
            -f lavfi -i "anoisesrc=color=brown:duration=${D}:amplitude=0.007" \
            -filter_complex "[0:a]volume=0.008,lowpass=f=120[a0];[1:a]volume=0.0028,lowpass=f=180[a1];[2:a]volume=0.0013,lowpass=f=240[a2];[3:a]lowpass=f=300,highpass=f=32,volume=0.2[a3];[a0][a1][a2][a3]amix=inputs=4,afade=t=in:st=0:d=5,afade=t=out:st=${FO}:d=10" \
            -c:a aac -b:a 128k -ar 48000 public/audio/bgm.m4a
      - name: Concatenate segments
        run: |
          mkdir -p out
          find parts -maxdepth 1 -name 'segment-*.mp4' -print | sort -V | while read -r f; do printf "file '%s'\n" "$(realpath "$f")"; done > out/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4
      - name: Mix narration and BGM
        run: |
          ffmpeg -y -loglevel error -i out/video-only.mp4 -i public/audio/narration.m4a -i public/audio/bgm.m4a \
            -filter_complex "[1:a]volume=1.0[vo];[2:a]volume=0.076[bg];[vo][bg]amix=inputs=2:duration=longest:dropout_transition=2[a]" \
            -map 0:v:0 -map "[a]" -c:v copy -c:a aac -b:a 192k -movflags +faststart -shortest out/v22-final.mp4
      - name: Verify and create QA sheet
        run: |
          test -s out/v22-final.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 out/v22-final.mp4
          ffmpeg -y -loglevel error -i out/v22-final.mp4 -vf "fps=1/30,scale=320:180,tile=7x7" -frames:v 1 -q:v 2 out/v22-contact-sheet.jpg
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VIDEO="knowledge-video-v22-emperor-doom-democracy-${GITHUB_RUN_ID}.mp4"
          cp out/v22-final.mp4 "out/${VIDEO}"
          TAG="v22-emperor-doom-democracy-${GITHUB_RUN_ID}"
          gh release create "$TAG" "out/${VIDEO}" out/v22-contact-sheet.jpg \
            --repo "$GITHUB_REPOSITORY" \
            --title "V22 Emperor Doom Democracy Production ${GITHUB_RUN_ID}" \
            --notes "108 narration-linked cinematic scenes: Emperor Doom, Wonder Man, Avengers liberation, efficient dictatorship versus resilient democracy. ChatGPT-curated speech-data.json; no blanket kana conversion. Aoyama Ryusei Normal. Measured-audio master sync. Narration + restrained cinematic BGM only. Parallel segmented Remotion render."
