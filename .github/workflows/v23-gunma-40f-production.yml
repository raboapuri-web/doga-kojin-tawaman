name: V23 Gunma 40F Production

on:
  workflow_dispatch:
  push:
    branches: [v22-iteration]
    paths:
      - '.github/workflows/v23-gunma-40f-production.yml'
      - 'v23-gunma-40f/**'

concurrency:
  group: v23-gunma-40f-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    defaults:
      run:
        working-directory: v23-gunma-40f
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install audio tools and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type check before narration generation
        run: npm run check
      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then echo 'VOICEVOX ready'; exit 0; fi
            sleep 2
          done
          docker logs voicevox || true
          exit 1
      - name: Generate measured narration
        run: node scripts/generate-voicevox.mjs
      - name: Plan parallel render segments
        id: plan
        run: |
          MATRIX="$(node scripts/plan-segments.mjs)"
          echo "$MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
      - name: Upload prepared timing and narration
        uses: actions/upload-artifact@v4
        with:
          name: v23-gunma-prepared
          retention-days: 1
          if-no-files-found: error
          path: |
            v23-gunma-40f/src/sync-timing.json
            v23-gunma-40f/public/audio/narration.m4a

  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        working-directory: v23-gunma-40f
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Download measured timing
        uses: actions/download-artifact@v4
        with:
          name: v23-gunma-prepared
          path: v23-gunma-40f
      - name: Render segment ${{ matrix.id }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          mkdir -p out
          npx remotion render src/index.ts V23Gunma40F "out/segment-${{ matrix.id }}.mp4" \
            --frames=${{ matrix.start }}-${{ matrix.end }} \
            --codec=h264 \
            --crf=20 \
            --concurrency=2 \
            --log=warn
          test -s "out/segment-${{ matrix.id }}.mp4"
      - name: Upload segment ${{ matrix.id }}
        uses: actions/upload-artifact@v4
        with:
          name: v23-gunma-segment-${{ matrix.id }}
          retention-days: 1
          if-no-files-found: error
          path: v23-gunma-40f/out/segment-${{ matrix.id }}.mp4

  finalize:
    needs: [prepare, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: v23-gunma-40f
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download narration and timing
        uses: actions/download-artifact@v4
        with:
          name: v23-gunma-prepared
          path: v23-gunma-40f
      - name: Download all rendered segments
        uses: actions/download-artifact@v4
        with:
          pattern: v23-gunma-segment-*
          path: v23-gunma-40f/parts
          merge-multiple: true
      - name: Generate BGM
        run: node scripts/generate-bgm.mjs
      - name: Concatenate parallel segments without re-encoding
        run: |
          mkdir -p out
          find parts -maxdepth 1 -name 'segment-*.mp4' -print | sort -V | while read -r f; do
            printf "file '%s'\n" "$(realpath "$f")"
          done > out/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4
      - name: Mix narration and BGM
        run: |
          ffmpeg -y -loglevel error \
            -i out/video-only.mp4 \
            -i public/audio/narration.m4a \
            -i public/audio/bgm.m4a \
            -filter_complex "[1:a]volume=1.0[vo];[2:a]volume=0.075[bg];[vo][bg]amix=inputs=2:duration=longest:dropout_transition=2[a]" \
            -map 0:v:0 -map "[a]" \
            -c:v copy -c:a aac -b:a 192k -movflags +faststart -shortest \
            out/v23-gunma-40f-final.mp4
      - name: Verify render duration
        run: |
          test -s out/v23-gunma-40f-final.mp4
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 out/v23-gunma-40f-final.mp4)
          echo "Final duration: ${DURATION}s"
          python3 - <<'PY'
          import subprocess
          d=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1','out/v23-gunma-40f-final.mp4']).decode().strip())
          assert 300 <= d <= 1800, f'Unexpected duration: {d:.2f}s'
          PY
      - name: Create QA contact sheet
        run: |
          ffmpeg -y -loglevel error -i out/v23-gunma-40f-final.mp4 \
            -vf "fps=1/45,scale=320:180,tile=4x4" \
            -frames:v 1 -q:v 2 out/v23-gunma-40f-contact-sheet.jpg
      - name: Upload completed movie
        uses: actions/upload-artifact@v4
        with:
          name: v23-gunma-40f-final-${{ github.run_id }}
          retention-days: 5
          if-no-files-found: error
          path: |
            v23-gunma-40f/out/v23-gunma-40f-final.mp4
            v23-gunma-40f/out/v23-gunma-40f-contact-sheet.jpg
