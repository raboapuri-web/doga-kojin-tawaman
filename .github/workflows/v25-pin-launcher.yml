name: V25 PIN Test Launcher

on:
  push:
    branches:
      - v25-ai
    paths:
      - '.github/workflows/v25-pin-launcher.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-pin-test:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch V25 owner PIN test
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/raboapuri-web/doga-kojin-tawaman/actions/workflows/v25-openai-guard.yml/dispatches \
            --data '{"ref":"v25-ai","inputs":{"purpose":"request-pin-approval","max_budget_usd":"3.00"}}'
          echo "Dispatched V25 owner PIN approval test."
