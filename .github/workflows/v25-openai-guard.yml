name: V25 Email OTP Gateway Guard

on:
  workflow_dispatch:
    inputs:
      purpose:
        description: "AI operation purpose"
        required: true
        default: "preflight"
        type: choice
        options:
          - preflight
          - request-email-otp
      max_budget_usd:
        description: "Maximum OpenAI spend authorized for this run (future gateway)"
        required: true
        default: "3.00"
  push:
    branches:
      - v25-ai

permissions:
  contents: read

concurrency:
  group: v25-email-otp-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_REPOSITORY: raboapuri-web/doga-kojin-tawaman
  EXPECTED_ACTOR: raboapuri-web
  EXPECTED_PUSH_REF: refs/heads/v25-ai

jobs:
  authorize-github-context:
    name: Verify GitHub execution context
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.guard.outputs.allowed }}
    steps:
      - name: Reject unsupported repository, actor, branch or event
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          echo "allowed=false" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" ]]; then
            echo "Blocked: unexpected repository."
            exit 1
          fi

          # This is only a first-line filter. A shared GitHub account is NOT
          # considered proof of human identity. Email OTP will be authoritative.
          if [[ "$GITHUB_ACTOR" != "$EXPECTED_ACTOR" ]]; then
            echo "Blocked: unexpected GitHub actor."
            exit 1
          fi

          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              ;;
            push)
              if [[ "$GITHUB_REF" != "$EXPECTED_PUSH_REF" ]]; then
                echo "Blocked: pushes are restricted to v25-ai."
                exit 1
              fi
              ;;
            *)
              echo "Blocked: pull requests, forks, comments and other events cannot enter the AI path."
              exit 1
              ;;
          esac

          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "GitHub context accepted. Human identity still requires email OTP."

  policy-check:
    name: Confirm OpenAI is not directly reachable
    needs: authorize-github-context
    if: needs.authorize-github-context.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate V25 gateway-only policy
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number --exclude='v25-openai-guard.yml' --exclude-dir='.git' \
            -E 'secrets\.OPENAI_API_KEY|api\.openai\.com' \
            .github v25-auth 2>/dev/null; then
            echo "Blocked: V25 contains a direct OpenAI credential/API path."
            exit 1
          fi

          echo "Policy OK: V25 does not directly consume OPENAI_API_KEY or api.openai.com."

      - name: Explain gateway state
        shell: bash
        run: |
          echo "Email OTP gateway is scaffolded but not deployed yet."
          echo "No OpenAI API request is performed by this workflow."
          echo "Future authorization will bind repository/run_id/SHA/ref/budget and require a one-time email approval."

  gateway-preflight:
    name: Email OTP gateway preflight
    needs:
      - authorize-github-context
      - policy-check
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.purpose == 'request-email-otp' &&
      needs.authorize-github-context.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse until gateway is explicitly configured
        shell: bash
        env:
          AUTH_GATEWAY_URL: ${{ secrets.AUTH_GATEWAY_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${AUTH_GATEWAY_URL:-}" ]]; then
            echo "Gateway is intentionally not configured yet. No API usage occurred."
            exit 1
          fi

          node v25-auth/gateway-client.mjs preflight \
            --url "$AUTH_GATEWAY_URL" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --sha "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --actor "$GITHUB_ACTOR" \
            --max-budget-usd "${{ github.event.inputs.max_budget_usd }}"
