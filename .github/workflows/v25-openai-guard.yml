name: V25 Owner PIN Gateway Guard

on:
  workflow_dispatch:
    inputs:
      purpose:
        description: "AI operation purpose"
        required: true
        default: "request-pin-approval"
        type: choice
        options:
          - request-pin-approval
      max_budget_usd:
        description: "Maximum AI spend authorized for this run"
        required: true
        default: "3.00"

permissions:
  contents: read

concurrency:
  group: v25-pin-approval-${{ github.run_id }}
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: raboapuri-web/doga-kojin-tawaman
  EXPECTED_ACTOR: github-actions[bot]
  EXPECTED_REF: refs/heads/v25-ai
  AUTH_GATEWAY_URL: https://fancy-frog-8692v25-auth-gateway.zhenyuan0803.workers.dev

jobs:
  authorize-github-context:
    name: Verify GitHub execution context
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.guard.outputs.allowed }}
    steps:
      - name: Reject unsupported repository, actor, branch or event
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          echo "allowed=false" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" ]]; then
            echo "Blocked: unexpected repository."
            exit 1
          fi

          if [[ "$GITHUB_ACTOR" != "$EXPECTED_ACTOR" ]]; then
            echo "Blocked: unexpected GitHub actor."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "Blocked: only workflow_dispatch can enter the PIN-gated AI path."
            exit 1
          fi

          if [[ "$GITHUB_REF" != "$EXPECTED_REF" ]]; then
            echo "Blocked: authorization is restricted to v25-ai."
            exit 1
          fi

          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "GitHub machine context accepted. Human identity still requires the Cloudflare-only owner PIN."

  policy-check:
    name: Confirm gateway-only AI policy
    needs: authorize-github-context
    if: needs.authorize-github-context.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject direct provider credential/API paths in V25
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number --exclude='v25-openai-guard.yml' --exclude-dir='.git' \
            -E 'secrets\.OPENAI_API_KEY|api\.openai\.com' \
            .github v25-auth 2>/dev/null; then
            echo "Blocked: V25 contains a direct provider credential/API path."
            exit 1
          fi

          echo "Policy OK: V25 is gateway-only."

  gateway-authorization:
    name: Request owner PIN authorization
    needs:
      - authorize-github-context
      - policy-check
    if: >-
      github.event.inputs.purpose == 'request-pin-approval' &&
      needs.authorize-github-context.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      authorization_id: ${{ steps.pin_request.outputs.authorization_id }}
      approval_url: ${{ steps.pin_request.outputs.approval_url }}
      execution_token: ${{ steps.pin.outputs.execution_token }}
      execution_token_expires_at: ${{ steps.pin.outputs.execution_token_expires_at }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deployed authorization gateway URL
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$AUTH_GATEWAY_URL" != https://*.workers.dev ]]; then
            echo "Gateway URL is invalid."
            exit 1
          fi
          echo "Using gateway: $AUTH_GATEWAY_URL"

      - name: Request owner PIN authorization
        id: pin_request
        shell: bash
        run: |
          set -euo pipefail
          node v25-auth/gateway-client.mjs request-authorization \
            --url "$AUTH_GATEWAY_URL" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --sha "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --actor "$GITHUB_ACTOR" \
            --purpose "generate-scene-assets" \
            --max-budget-usd "${{ github.event.inputs.max_budget_usd }}"

      - name: Write PIN approval descriptor
        shell: bash
        env:
          AUTHORIZATION_ID: ${{ steps.pin_request.outputs.authorization_id }}
          APPROVAL_URL: ${{ steps.pin_request.outputs.approval_url }}
          APPROVAL_EXPIRES_AT: ${{ steps.pin_request.outputs.authorization_expires_at }}
        run: |
          set -euo pipefail
          jq -n \
            --arg authorization_id "$AUTHORIZATION_ID" \
            --arg approval_url "$APPROVAL_URL" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg expires_at "$APPROVAL_EXPIRES_AT" \
            '{authorization_id:$authorization_id,approval_url:$approval_url,run_id:$run_id,expires_at:$expires_at}' \
            > "$RUNNER_TEMP/v25-pin-approval.json"

      - name: Publish PIN approval descriptor
        uses: actions/upload-artifact@v4
        with:
          name: v25-pin-approval-${{ github.run_id }}
          path: ${{ runner.temp }}/v25-pin-approval.json
          retention-days: 1
          if-no-files-found: error

      - name: Wait for owner PIN approval
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          node v25-auth/gateway-client.mjs wait-authorization \
            --url "$AUTH_GATEWAY_URL" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --sha "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --actor "$GITHUB_ACTOR" \
            --purpose "generate-scene-assets" \
            --max-budget-usd "${{ github.event.inputs.max_budget_usd }}" \
            --authorization-id "${{ steps.pin_request.outputs.authorization_id }}" \
            --timeout-seconds "300" \
            --poll-seconds "5"

      - name: Stop before any billable AI call
        shell: bash
        run: |
          echo "Owner PIN approval pipeline is ready."
          echo "No billable AI proxy step is connected yet."
