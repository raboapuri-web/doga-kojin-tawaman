name: V19 Child Luxury Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v19-child-luxury-production.yml'
      - 'v19-child-luxury/**'

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    defaults:
      run:
        working-directory: v19-child-luxury
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install tools and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f
          cp ../v15-chiikawa/package.json package.json
          cp ../v15-chiikawa/tsconfig.json tsconfig.json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate ChatGPT-curated narration script
        run: |
          python3 - <<'PY'
          import json,re
          src=json.load(open('src/script-data.json',encoding='utf-8'))
          voice=json.load(open('src/speech-data.json',encoding='utf-8'))
          src_ids=[b['id'] for b in src['beats']]
          voice_ids=[b['id'] for b in voice['beats']]
          if src_ids != voice_ids:
            raise SystemExit('speech-data.json beat IDs/order do not match script-data.json')
          bad=[]
          for b in voice['beats']:
            text=b.get('speech','').strip()
            if not text:
              bad.append((b['id'],'empty speech'))
            # Risky notation must be resolved by ChatGPT before synthesis.
            if re.search(r'[0-9A-Za-z]',text):
              bad.append((b['id'],text))
          if bad:
            print('Unsafe curated narration:',bad[:10])
            raise SystemExit('Curated narration still contains raw digits or ASCII letters')
          print(f'Curated narration validated: {len(voice_ids)} beats')
          print('Kanji are intentionally allowed to preserve Japanese context and VOICEVOX morphology.')
          PY
      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do curl -fsS http://127.0.0.1:50021/version >/dev/null && exit 0; sleep 2; done
          docker logs voicevox || true
          exit 1
      - name: Generate measured narration from curated speech
        run: |
          mkdir -p public/audio .voice-tmp
          cat > /tmp/v19voice.mjs <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import {execFileSync} from 'node:child_process';
          const root=process.cwd();
          const script=JSON.parse(fs.readFileSync('src/script-data.json','utf8'));
          const voice=JSON.parse(fs.readFileSync('src/speech-data.json','utf8'));
          const voiceMap=new Map(voice.beats.map(b=>[b.id,b.speech]));
          const base='http://127.0.0.1:50021';
          const speakers=await fetch(`${base}/speakers`).then(r=>r.json());
          const sp=speakers.find(s=>s.name==='青山龍星')??speakers[0];
          const st=sp.styles.find(s=>s.name==='ノーマル')??sp.styles[0];
          console.log(`VOICEVOX ${sp.name}/${st.name}/${st.id}`);
          let cursor=0;const timings=[],files=[];
          for(let i=0;i<script.beats.length;i++){
            const b=script.beats[i];const text=voiceMap.get(b.id);if(!text)throw new Error(`missing curated speech ${b.id}`);
            const q=await fetch(`${base}/audio_query?speaker=${st.id}&text=${encodeURIComponent(text)}`,{method:'POST'}).then(r=>r.json());
            q.speedScale=1.02;q.pitchScale=-.02;q.intonationScale=.90;q.prePhonemeLength=.08;q.postPhonemeLength=.10;
            const wav=Buffer.from(await fetch(`${base}/synthesis?speaker=${st.id}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(q)}).then(r=>r.arrayBuffer()));
            const raw=path.join(root,'.voice-tmp',`b-${String(i).padStart(2,'0')}.wav`),pad=path.join(root,'.voice-tmp',`b-${String(i).padStart(2,'0')}-p.wav`);
            fs.writeFileSync(raw,wav);execFileSync('ffmpeg',['-y','-loglevel','error','-i',raw,'-af','apad=pad_dur=0.16',pad]);
            const d=Number(execFileSync('ffprobe',['-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',pad],{encoding:'utf8'}).trim());
            timings.push({id:b.id,index:i,start:cursor,end:cursor+d});cursor+=d;files.push(pad);console.log(`${b.id}: ${d.toFixed(2)}s :: ${text.slice(0,42)}`);
          }
          const list=path.join(root,'.voice-tmp/list.txt');fs.writeFileSync(list,files.map(f=>`file '${f}'`).join('\n'));
          const joined=path.join(root,'.voice-tmp/narration.wav');execFileSync('ffmpeg',['-y','-loglevel','error','-f','concat','-safe','0','-i',list,'-c','copy',joined]);
          const measured=Number(execFileSync('ffprobe',['-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',joined],{encoding:'utf8'}).trim());
          fs.writeFileSync('src/sync-timing.json',JSON.stringify({durationSeconds:measured+.3,beats:timings},null,2));
          execFileSync('ffmpeg',['-y','-loglevel','error','-i',joined,'-c:a','aac','-b:a','160k','-ar','48000','public/audio/narration.m4a']);
          console.log(`Narration duration: ${measured.toFixed(2)}s`);
          NODE
          node /tmp/v19voice.mjs
      - name: Type check rich scenes
        run: npx tsc --noEmit
      - name: Plan render segments
        id: plan
        run: |
          MATRIX=$(node --input-type=module <<'NODE'
          import fs from 'node:fs';const s=JSON.parse(fs.readFileSync('src/sync-timing.json','utf8')),fps=30,target=165,max=205;let start=0,startSec=0,last=-1;const seg=[];for(let i=0;i<s.beats.length;i++){const b=s.beats[i],isLast=i===s.beats.length-1,elapsed=b.end-startSec,nextToo=!isLast&&(s.beats[i+1].end-startSec)>max;if(isLast||elapsed>=target||nextToo){const end=isLast?Math.ceil(s.durationSeconds*fps)-1:Math.max(start,Math.round(b.end*fps)-1);seg.push({id:String(seg.length).padStart(2,'0'),start,end});last=end;start=end+1;startSec=(end+1)/fps}}if(last<Math.ceil(s.durationSeconds*fps)-1)seg.push({id:String(seg.length).padStart(2,'0'),start:last+1,end:Math.ceil(s.durationSeconds*fps)-1});console.log(JSON.stringify({include:seg}));
          NODE
          )
          echo "$MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
      - name: Upload prepared narration and timing
        uses: actions/upload-artifact@v4
        with:
          name: v19-prepared
          retention-days: 1
          if-no-files-found: error
          path: |
            v19-child-luxury/src/sync-timing.json
            v19-child-luxury/public/audio/narration.m4a

  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        working-directory: v19-child-luxury
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
          cp ../v15-chiikawa/package.json package.json
          cp ../v15-chiikawa/tsconfig.json tsconfig.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: v19-prepared
          path: v19-child-luxury
      - name: Render rich segment ${{ matrix.id }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          mkdir -p out
          npx remotion render src/index.tsx V19ChildLuxury "out/segment-${{ matrix.id }}.mp4" \
            --frames=${{ matrix.start }}-${{ matrix.end }} \
            --codec=h264 --crf=19 --concurrency=2 --log=warn
          test -s "out/segment-${{ matrix.id }}.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: v19-segment-${{ matrix.id }}
          retention-days: 1
          if-no-files-found: error
          path: v19-child-luxury/out/segment-${{ matrix.id }}.mp4

  finalize:
    needs: [prepare, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: v19-child-luxury
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: v19-prepared
          path: v19-child-luxury
      - uses: actions/download-artifact@v4
        with:
          pattern: v19-segment-*
          path: v19-child-luxury/parts
          merge-multiple: true
      - name: Generate restrained dark BGM
        run: |
          mkdir -p public/audio
          D=$(node -e "const s=require('./src/sync-timing.json');console.log(Math.ceil(s.durationSeconds+2))")
          FO=$((D-8))
          ffmpeg -y -loglevel error \
            -f lavfi -i "sine=frequency=43:duration=${D}" \
            -f lavfi -i "sine=frequency=65:duration=${D}" \
            -f lavfi -i "anoisesrc=color=brown:duration=${D}:amplitude=0.010" \
            -filter_complex "[0:a]volume=0.008,lowpass=f=145[a0];[1:a]volume=0.0027,lowpass=f=210[a1];[2:a]lowpass=f=390,highpass=f=34,volume=0.28[a2];[a0][a1][a2]amix=inputs=3,afade=t=in:st=0:d=4,afade=t=out:st=${FO}:d=8" \
            -c:a aac -b:a 128k -ar 48000 public/audio/bgm.m4a
      - name: Concatenate segments losslessly
        run: |
          mkdir -p out
          find parts -maxdepth 1 -name 'segment-*.mp4' -print | sort -V | while read -r f; do printf "file '%s'\n" "$(realpath "$f")"; done > out/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4
      - name: Mix narration and BGM only
        run: |
          ffmpeg -y -loglevel error -i out/video-only.mp4 -i public/audio/narration.m4a -i public/audio/bgm.m4a \
            -filter_complex "[1:a]volume=1.0[vo];[2:a]volume=0.09[bg];[vo][bg]amix=inputs=2:duration=longest:dropout_transition=2[a]" \
            -map 0:v:0 -map "[a]" -c:v copy -c:a aac -b:a 192k -movflags +faststart -shortest out/v19-final.mp4
      - name: Verify and create QA sheet
        run: |
          test -s out/v19-final.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 out/v19-final.mp4
          ffmpeg -y -loglevel error -i out/v19-final.mp4 -vf "fps=1/32,scale=320:180,tile=7x7" -frames:v 1 -q:v 2 out/v19-contact-sheet.jpg
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VIDEO="knowledge-video-v19-child-luxury-${GITHUB_RUN_ID}.mp4"
          cp out/v19-final.mp4 "out/${VIDEO}"
          TAG="v19-child-luxury-${GITHUB_RUN_ID}"
          gh release create "$TAG" "out/${VIDEO}" out/v19-contact-sheet.jpg \
            --repo "$GITHUB_REPOSITORY" \
            --title "V19 Child Luxury Production ${GITHUB_RUN_ID}" \
            --notes "67 narration-linked cinematic scenes. Subtitles preserve the original text. VOICEVOX uses a separate ChatGPT-curated speech-data.json with explicit context-aware readings for ambiguous numbers, counters, acronyms and foreign terms; blanket kakasi conversion is disabled. Aoyama Ryusei Normal. Measured-audio master sync. Narration + BGM only, no SFX. Parallel segmented Remotion render."
