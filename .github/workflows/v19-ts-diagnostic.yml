name: V19 TS Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v19-ts-diagnostic.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: v19-child-luxury
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare package
        run: |
          cp ../v15-chiikawa/package.json package.json
          cp ../v15-chiikawa/tsconfig.json tsconfig.json
          npm install
      - name: Capture TypeScript errors
        run: |
          set +e
          npx tsc --noEmit > ../v19-tsc-error.txt 2>&1
          CODE=$?
          set -e
          cat ../v19-tsc-error.txt
          cd ..
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add v19-tsc-error.txt
          git commit -m 'Capture V19 TypeScript diagnostics' || true
          git push
          exit $CODE
