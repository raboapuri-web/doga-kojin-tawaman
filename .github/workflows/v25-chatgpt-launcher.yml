name: V25 ChatGPT Video Launcher

on:
  push:
    branches:
      - v25-ai
    paths:
      - 'v25-auth/requests/current.json'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-pin-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate ChatGPT video request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          file="v25-auth/requests/current.json"
          jq -e '.request_id | type == "string" and length > 0' "$file" >/dev/null
          jq -e '.title | type == "string" and length > 0' "$file" >/dev/null
          jq -e '.requested_by == "chatgpt"' "$file" >/dev/null

          budget="$(jq -r '.max_budget_usd // 3.00' "$file")"
          if ! awk -v b="$budget" 'BEGIN { exit !(b > 0 && b <= 25) }'; then
            echo "Invalid max_budget_usd: $budget"
            exit 1
          fi

          request_id="$(jq -r '.request_id' "$file")"
          title="$(jq -r '.title' "$file")"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "budget=$budget" >> "$GITHUB_OUTPUT"
          echo "Validated ChatGPT video request: $request_id / $title"

      - name: Dispatch PIN-gated AI authorization
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_BUDGET_USD: ${{ steps.request.outputs.budget }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc \
            --arg ref "v25-ai" \
            --arg budget "$MAX_BUDGET_USD" \
            '{ref:$ref,inputs:{purpose:"request-pin-approval",max_budget_usd:$budget}}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/raboapuri-web/doga-kojin-tawaman/actions/workflows/v25-openai-guard.yml/dispatches \
            --data "$payload"

          echo "Dispatched PIN-gated V25 authorization."
